name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Validate release tag
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const expected = `v${version}`;
          const actual = process.env.GITHUB_REF_NAME;
          if (actual !== expected) {
            throw new Error(`Release tag must be ${expected}, got ${actual}`);
          }
          JS
      - run: bun install --frozen-lockfile
      - run: bun run build:check
      - run: bun run test
      - name: Pack prebuilt release
        run: |
          mkdir -p release-artifacts
          npm pack --ignore-scripts --pack-destination release-artifacts
          package_tarball=$(find release-artifacts -maxdepth 1 -type f \
            -name '*.tgz' -print -quit)
          test -n "$package_tarball"
          cp "$package_tarball" release-artifacts/pi-ask-user.tgz
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-artifacts/*.tgz \
            --verify-tag --generate-notes
