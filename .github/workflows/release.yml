name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      # v2.0.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.4.2
      - name: Validate release tag
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const expected = `v${version}`;
          const actual = process.env.GITHUB_REF_NAME;
          if (actual !== expected) {
            throw new Error(`Release tag must be ${expected}, got ${actual}`);
          }
          JS
      - run: bun install --frozen-lockfile
      - run: bun run build:check
      - run: bun run test
      - name: Pack prebuilt release
        run: |
          mkdir -p release-artifacts
          npm pack --ignore-scripts --pack-destination release-artifacts
          package_tarball=$(find release-artifacts -maxdepth 1 -type f \
            -name '*.tgz' -print -quit)
          test -n "$package_tarball"
          cp "$package_tarball" release-artifacts/pi-ask-user.tgz
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" release-artifacts/*.tgz --clobber
      - name: Prepare npm artifact
        run: |
          mkdir -p npm-artifact
          cp release-artifacts/pi-ask-user.tgz npm-artifact/package.tgz
          cp package.json npm-artifact/package.json
      # v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-package
          path: npm-artifact/*
          if-no-files-found: error
  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.5.1
      # v4.3.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: npm-package
          path: npm-package
      - name: Publish package to npm
        run: |
          set -euo pipefail
          package_name=$(node -p "require('./npm-package/package.json').name")
          package_version=$(node -p "require('./npm-package/package.json').version")
          local_integrity=sha512-
          local_integrity+=$(openssl dgst -sha512 -binary \
            npm-package/package.tgz | openssl base64 -A)
          npm_spec="$package_name@$package_version"
          if npm view "$npm_spec" dist.integrity --json \
              >npm-integrity.json 2>npm-view.err; then
            published_integrity=$(node -p "require('./npm-integrity.json')")
            if [ "$published_integrity" = "$local_integrity" ]; then
              echo "npm already has this tarball; skipping duplicate publish."
              exit 0
            fi
            echo "Published npm version has different tarball integrity." >&2
            exit 1
          fi
          if ! grep -Fq 'E404' npm-view.err; then
            cat npm-view.err >&2
            exit 1
          fi
          npm publish npm-package/package.tgz --access public --ignore-scripts
